server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Content-hashed by Next, so safe to cache for good.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Metadata routes export without an extension, so nginx cannot infer a type.
  location = /opengraph-image {
    default_type image/png;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
